name: Consulta CNMP Agendada

on:
  schedule:
    # Toda segunda-feira às 06:00 UTC (03:00 Brasília)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      termo:
        description: "Nome da parte"
        default: "Ministério Público do Estado de Pernambuco"
        required: false
      formato:
        description: "Formatos de saída (separados por espaço)"
        default: "txt csv json"
        required: false

jobs:
  consulta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -e ".[browserbase]"
          pip install playwright openpyxl

      - name: Instalar Chromium (fallback local)
        run: python -m playwright install chromium --with-deps

      - name: Executar consulta via Browserbase
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: |
          TERMO="${{ github.event.inputs.termo || 'Ministério Público do Estado de Pernambuco' }}"
          FORMATOS="${{ github.event.inputs.formato || 'txt csv json' }}"
          consultas-cnmp \
            --termo "$TERMO" \
            --formato $FORMATOS \
            --saida resultados \
            --browserbase

      - name: Commit e push dos resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --staged --quiet || git commit -m "chore: atualiza resultados $(date +'%Y-%m-%d')"
          git push
